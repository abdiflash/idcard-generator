<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator ID Card Karyawan & Pelajar</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CDN Third-Party Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    @font-face {
      font-family: 'DIN Bold';
      src: local('DIN Bold'), local('DIN-Bold'), local('DINCondensed-Bold'), local('DIN Condensed'), local('Arial Narrow');
    }

    :root {
      --bg-main: #0b1120;
      --card-bg: #151e32;
      --card-border: #1e2d4a;
      --accent-soft: #3b82f6;
      --accent-hover: #2563eb;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
    }

    .step-header {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-step {
      background: var(--accent-soft);
      color: #fff;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.75rem;
    }

    .form-control, .form-select {
      background-color: #090e1a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 0.875rem;
      border-radius: 8px;
    }

    .form-control:focus, .form-select:focus {
      background-color: #090e1a;
      border-color: var(--accent-cyan);
      color: var(--text-main);
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.15);
    }

    .form-range::-webkit-slider-thumb {
      background: var(--accent-cyan);
    }

    .input-preset-num {
      background-color: #090e1a !important;
      color: var(--accent-cyan) !important;
      border: 1px solid var(--card-border) !important;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .camera-wrapper {
      position: relative;
      width: 170px;
      height: 220px;
      background-color: #050811;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      flex-shrink: 0;
    }

    #videoElement {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .crop-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed var(--accent-cyan);
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    }
    .crop-overlay.circle { width: 110px; height: 110px; border-radius: 50%; }

    .data-list {
      max-height: 220px;
      overflow-y: auto;
    }

    .data-item {
      background-color: #090e1a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .data-item:hover {
      background-color: #1e293b;
    }

    .data-item.active {
      background-color: #1e3a8a !important;
      border-color: var(--accent-cyan);
    }

    #previewCanvas {
      width: 100%;
      max-width: 200px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      background: #ffffff;
      flex-shrink: 0;
    }

    .target-badge {
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 200px;
    }

    .btn-modern {
      background-color: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      width: 100%;
    }

    .btn-modern:hover {
      background-color: #334155;
      color: #ffffff;
      border-color: #475569;
    }

    .btn-modern-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      border: none;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-modern-primary:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .btn-modern-danger {
      background-color: transparent;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .btn-modern-danger:hover {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.5);
    }
  </style>
</head>
<body class="py-4">
  <div class="container-fluid px-4" style="max-width: 1400px;">
    <div class="row g-4">
      
      <!-- KOLOM 1: PRESET & INPUT DATA (KIRI) -->
      <div class="col-lg-6">
        
        <div class="card p-3 mb-3">
          <div class="step-header"><span class="badge-step"><i class="fa-solid fa-sliders"></i></span> PRESET LAYOUT & PENYESUAIAN VISUAL</div>
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label small fw-semibold text-muted mb-1">Jenis Preset Layout:</label>
              <select id="presetSelect" class="form-select" onchange="renderCard()">
                <option value="karyawan" selected>ID Card Karyawan (circle)</option>
                <option value="pelajar">ID Card Pelajar (circle)</option>
              </select>
            </div>
            <div class="col-md-7">
              <label class="form-label small fw-semibold text-muted mb-1">Teks Footer Website:</label>
              <input type="text" id="footerInput" class="form-control" value="www.edueasy.id" placeholder="Contoh: www.sekolah.sch.id" oninput="renderCard()">
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small text-muted m-0">Skala Foto</label>
                <div class="input-group input-group-sm" style="width: 75px;">
                  <input type="number" id="photoScaleNum" class="form-control text-end p-1 input-preset-num" min="50" max="200" value="100" oninput="syncNumToSlider('photoScale', 'photoScaleNum')">
                  <span class="input-group-text bg-dark text-muted border-secondary p-1 small">%</span>
                </div>
              </div>
              <input type="range" class="form-range" id="photoScale" min="50" max="200" value="100" oninput="syncSliderToNum('photoScale', 'photoScaleNum')">
            </div>

            <div class="col-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small text-muted m-0">Foto Y</label>
                <div class="input-group input-group-sm" style="width: 75px;">
                  <input type="number" id="photoYNum" class="form-control text-end p-1 input-preset-num" min="-150" max="150" value="0" oninput="syncNumToSlider('photoY', 'photoYNum')">
                  <span class="input-group-text bg-dark text-muted border-secondary p-1 small">px</span>
                </div>
              </div>
              <input type="range" class="form-range" id="photoY" min="-150" max="150" value="0" oninput="syncSliderToNum('photoY', 'photoYNum')">
            </div>

            <div class="col-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small text-muted m-0">Teks Y</label>
                <div class="input-group input-group-sm" style="width: 75px;">
                  <input type="number" id="textYNum" class="form-control text-end p-1 input-preset-num" min="-50" max="250" value="0" oninput="syncNumToSlider('textY', 'textYNum')">
                  <span class="input-group-text bg-dark text-muted border-secondary p-1 small">px</span>
                </div>
              </div>
              <input type="range" class="form-range" id="textY" min="-50" max="250" value="0" oninput="syncSliderToNum('textY', 'textYNum')">
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <div class="card p-3 h-100">
              <div class="step-header"><span class="badge-step">1</span> DATABASE (EXCEL/CSV)</div>
              <input type="file" id="excelInput" class="form-control" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
            </div>
          </div>
          <div class="col-md-6">
            <div class="card p-3 h-100">
              <div class="step-header"><span class="badge-step">2</span> TEMPLATE BACKGROUND ID CARD</div>
              <input type="file" id="templateInput" class="form-control" accept="image/*" onchange="handleTemplateUpload(event)">
            </div>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <div class="step-header"><span class="badge-step">3</span> INPUT KAMERA (HP / USB)</div>
          <div class="d-flex gap-2 align-items-center">
            <select id="cameraSelect" class="form-select"></select>
            <button class="btn-modern btn-modern-primary" style="width: auto;" onclick="startCamera()">
              <i class="fa-solid fa-video"></i> Start
            </button>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <div class="step-header"><span class="badge-step">4</span> PILIH DATA KARYAWAN / PELAJAR</div>
          <input type="text" id="searchInput" class="form-control mb-2" placeholder="Cari Nama / NIK / NPP / NISN..." oninput="filterDataList()">
          <div class="list-group data-list" id="dataListContainer">
            <div class="list-group-item data-item text-muted text-center py-3">Unggah file database Excel/CSV untuk menampilkan daftar data...</div>
          </div>
        </div>

      </div>

      <!-- KOLOM 2: AMBIL FOTO & PREVIEW HASIL (KANAN) -->
      <div class="col-lg-6">
        
        <!-- STEP 5: AMBIL / UNGGAH FOTO -->
        <div class="card p-3 mb-3">
          <div class="step-header"><span class="badge-step">5</span> AMBIL / UNGGAH FOTO</div>
          
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-sm-start gap-4 py-1">
            <div class="camera-wrapper">
              <video id="videoElement" autoplay playsinline></video>
              <div id="cropOverlay" class="crop-overlay circle"></div>
            </div>

            <div class="btn-action-group">
              <button class="btn-modern btn-modern-primary" onclick="capturePhoto()">
                <i class="fa-solid fa-camera"></i> Jepret Kamera
              </button>
              
              <label class="btn-modern m-0">
                <i class="fa-solid fa-file-image text-info"></i> Unggah Single Foto
                <input type="file" hidden accept="image/*" onchange="handleSinglePhotoUpload(event)">
              </label>

              <label class="btn-modern m-0">
                <i class="fa-solid fa-folder-open text-warning"></i> Unggah Bulk Foto
                <input type="file" hidden webkitdirectory directory multiple onchange="handleFolderUpload(event)">
              </label>
            </div>
          </div>
        </div>

        <!-- PREVIEW ID CARD -->
        <div class="card p-3">
          <div class="d-flex justify-content-between align-items-center w-100 mb-3 border-bottom border-secondary border-opacity-25 pb-2">
            <h6 class="fw-bold tracking-wide m-0 text-uppercase text-light" style="font-size:0.85rem;">Preview ID Card</h6>
            <span class="target-badge" id="targetInfo"><i class="fa-solid fa-user-tag me-1"></i> Target: Belum Memilih Data</span>
          </div>

          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-sm-start gap-4 py-2">
            <!-- Canvas Preview -->
            <canvas id="previewCanvas" width="673" height="1063"></canvas>

            <div class="btn-action-group">
              <button class="btn-modern btn-modern-primary" onclick="downloadSingleCard()">
                <i class="fa-solid fa-download"></i> Unduh PNG
              </button>
              <button class="btn-modern" onclick="downloadZipBatch()">
                <i class="fa-solid fa-file-zipper text-info"></i> Unduh ZIP Batch
              </button>
              <button class="btn-modern btn-modern-danger" onclick="deleteCurrentPhoto()">
                <i class="fa-solid fa-trash"></i> Hapus Foto
              </button>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <canvas id="hiddenBarcodeCanvas" style="display:none;"></canvas>

  <script>
    let databaseData = [];
    let selectedIndex = -1;
    let templateImage = new Image();
    let currentStream = null;

    window.onload = function() {
      createBlankTemplate();
    };

    function syncSliderToNum(sliderId, numId) {
      const sliderVal = document.getElementById(sliderId).value;
      document.getElementById(numId).value = sliderVal;
      renderCard();
    }

    function syncNumToSlider(sliderId, numId) {
      const numInput = document.getElementById(numId);
      const slider = document.getElementById(sliderId);
      let val = parseInt(numInput.value);
      
      if (isNaN(val)) val = 0;
      if (val < parseInt(slider.min)) val = parseInt(slider.min);
      if (val > parseInt(slider.max)) val = parseInt(slider.max);
      
      slider.value = val;
      renderCard();
    }

    function createBlankTemplate() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 673;
      tempCanvas.height = 1063;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = "#ffffff";
      tCtx.fillRect(0, 0, 673, 1063);
      templateImage.src = tempCanvas.toDataURL();
      templateImage.onload = function() { renderCard(); };
    }

    function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rawData = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
          
          databaseData = rawData.map(item => {
            const norm = {};
            Object.keys(item).forEach(k => {
              const cleanK = k.toString().toLowerCase().replace(/[^a-z0-9]/g, '');
              norm[cleanK] = String(item[k]).trim();
            });

            // Pemetaan Kolom NPP / NIK / ID / NISN
            const nisnVal = norm['npp'] || norm['nppnik'] || norm['nik'] || norm['nisn'] || norm['nis'] || norm['id'] || '';
            
            // Pemetaan Kolom Nama Lengkap
            const namaVal = norm['namalengkap'] || norm['nama'] || norm['namakaryawan'] || norm['namapegawai'] || '';
            
            // Pemetaan Kolom Unit / Jabatan / Departemen
            let unitVal = norm['unit'] || norm['unitkerja'] || norm['jabatan'] || norm['divisi'] || norm['departemen'] || norm['dept'] || norm['bagian'] || norm['subbagian'] || norm['penempatan'] || norm['posisi'] || '';

            if (!unitVal) {
              const matchingKey = Object.keys(norm).find(k => 
                k.includes('unit') || k.includes('dept') || k.includes('divisi') || k.includes('jabatan') || k.includes('bagian')
              );
              if (matchingKey) {
                unitVal = norm[matchingKey];
              }
            }

            const tempatLahirVal = norm['tempatlahir'] || norm['tmplahir'] || norm['tempat'] || '';
            const tglVal = norm['tanggallahir'] || norm['tgllahir'] || norm['tgl'] || '';
            
            let vaRaw = norm['nova'] || norm['va'] || norm['virtualaccount'] || norm['virtual'] || '';
            const vaVal = String(vaRaw).trim().replace(/,/g, '.');

            return {
              nisn: nisnVal,
              nama: namaVal,
              unit: unitVal,
              tempatLahir: tempatLahirVal,
              tglLahir: tglVal,
              noVa: vaVal,
              photo: null
            };
          });

          renderDataList(databaseData);
          if (databaseData.length > 0) selectDataItem(0);
        } catch (err) {
          alert("Gagal membaca file database: " + err.message);
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function renderDataList(list) {
      const container = document.getElementById('dataListContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="list-group-item data-item text-muted text-center py-3">Tidak ada data ditemukan.</div>';
        return;
      }

      list.forEach((item) => {
        const realIndex = databaseData.indexOf(item);

        const el = document.createElement('div');
        el.className = `list-group-item data-item d-flex justify-content-between align-items-center py-2 px-3 ${realIndex === selectedIndex ? 'active' : ''}`;
        el.onclick = () => selectDataItem(realIndex);
        
        const badgeStatus = item.photo 
          ? '<span class="badge bg-success"><i class="fa-solid fa-check"></i> Foto</span>' 
          : '<span class="badge bg-secondary">Belum</span>';
        
        el.innerHTML = `<div><strong class="text-info">${item.nisn || '-'}</strong> — ${item.nama || 'Tanpa Nama'} ${item.unit ? `<small class="text-muted">(${item.unit})</small>` : ''}</div> ${badgeStatus}`;
        container.appendChild(el);
      });
    }

    function filterDataList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = databaseData.filter(d => 
        d.nama.toLowerCase().includes(query) || d.nisn.toString().toLowerCase().includes(query) || d.unit.toLowerCase().includes(query)
      );
      renderDataList(filtered);
    }

    function selectDataItem(idx) {
      selectedIndex = idx;
      filterDataList();
      
      const current = databaseData[selectedIndex];
      if (current) {
        document.getElementById('targetInfo').innerHTML = `<i class="fa-solid fa-user-check me-1 text-success"></i> Target: ${current.nama} (${current.nisn})`;
      }
      renderCard();
    }

    function handleTemplateUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        templateImage = new Image();
        templateImage.onload = () => renderCard();
        templateImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function startCamera() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        const select = document.getElementById('cameraSelect');
        select.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Kamera ${index + 1}`;
          select.appendChild(option);
        });

        const constraints = {
          video: { 
            deviceId: select.value ? { exact: select.value } : undefined,
            width: { ideal: 720 },
            height: { ideal: 1280 }
          }
        };

        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('videoElement').srcObject = currentStream;
      } catch (err) {
        alert("Gagal mengakses kamera: " + err.message);
      }
    }

    function capturePhoto() {
      if (selectedIndex < 0) {
        alert("Pilih data karyawan/pelajar terlebih dahulu!");
        return;
      }
      const video = document.getElementById('videoElement');
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      
      const minDim = Math.min(video.videoWidth, video.videoHeight);
      const sx = (video.videoWidth - minDim) / 2;
      const sy = (video.videoHeight - minDim) / 2;
      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 400, 400);

      databaseData[selectedIndex].photo = canvas.toDataURL('image/png');
      filterDataList();
      renderCard();
    }

    function handleSinglePhotoUpload(e) {
      if (selectedIndex < 0) {
        alert("Pilih data terlebih dahulu!");
        return;
      }
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        databaseData[selectedIndex].photo = evt.target.result;
        filterDataList();
        renderCard();
      };
      reader.readAsDataURL(file);
    }

    function handleFolderUpload(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0 || databaseData.length === 0) {
        alert("Pastikan database Excel/CSV sudah diunggah terlebih dahulu!");
        return;
      }

      files.forEach(file => {
        const fileNameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')).toLowerCase();
        
        const matchedItem = databaseData.find(d => 
          d.nisn.toString().toLowerCase() === fileNameWithoutExt || 
          d.nama.toLowerCase() === fileNameWithoutExt
        );

        if (matchedItem) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            matchedItem.photo = evt.target.result;
            filterDataList();
            if (databaseData[selectedIndex] === matchedItem) renderCard();
          };
          reader.readAsDataURL(file);
        }
      });
    }

    function deleteCurrentPhoto() {
      if (selectedIndex >= 0 && databaseData[selectedIndex]) {
        databaseData[selectedIndex].photo = null;
        filterDataList();
        renderCard();
      }
    }

    function renderCard() {
      const canvas = document.getElementById('previewCanvas');
      const ctx = canvas.getContext('2d');
      const preset = document.getElementById('presetSelect').value;

      ctx.clearRect(0, 0, 673, 1063);
      if (templateImage.complete && templateImage.naturalWidth > 0) {
        ctx.drawImage(templateImage, 0, 0, 673, 1063);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 673, 1063);
      }

      const activeData = databaseData[selectedIndex] || {
        nama: 'Drs. Hendra Wijaya',
        nisn: 'G-2018001',
        unit: 'Guru Matematika',
        tempatLahir: 'Jakarta',
        tglLahir: '15 Maret 1985',
        noVa: '880.120.241.001',
        photo: null
      };

      const scale = parseFloat(document.getElementById('photoScale').value) / 100;
      const photoY = parseFloat(document.getElementById('photoY').value);
      const textY = parseFloat(document.getElementById('textY').value);

      if (activeData.photo) {
        const img = new Image();
        img.onload = function() {
          ctx.save();
          const centerX = 336.5;
          const centerY = 425 + photoY;
          const radius = (250 * scale) / 2;

          ctx.beginPath();
          ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, centerX - radius, centerY - radius, radius * 2, radius * 2);
          ctx.restore();

          drawCardTextAndBarcode(ctx, activeData, preset, textY);
        };
        img.src = activeData.photo;
      } else {
        ctx.save();
        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.arc(336.5, 425 + photoY, (250 * scale) / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        
        drawCardTextAndBarcode(ctx, activeData, preset, textY);
      }
    }

    function drawCardTextAndBarcode(ctx, data, preset, textYOffset) {
      ctx.textAlign = "center";
      const fontDinBold = "'DIN Bold', 'DIN-Bold', 'DINCondensed-Bold', 'DIN Condensed', 'Arial Narrow', sans-serif";

      // 1. Nama Lengkap
      const namaText = (data.nama || 'NAMA PESERTA').toUpperCase();
      ctx.save();
      ctx.fillStyle = "#000000";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 1.6;
      ctx.font = `900 38px ${fontDinBold}`;
      ctx.strokeText(namaText, 336.5, 595 + textYOffset);
      ctx.fillText(namaText, 336.5, 595 + textYOffset);
      ctx.restore();

      // 2. Detail Teks (NPP/NIK & UNIT untuk Karyawan)
      ctx.font = `bold 24px ${fontDinBold}`;
      ctx.fillStyle = "#333333";

      if (preset === 'karyawan') {
        ctx.fillText(`NPP / NIK : ${data.nisn || '-'}`, 336.5, 635 + textYOffset);
        ctx.fillText(`UNIT : ${data.unit ? data.unit.toUpperCase() : '-'}`, 336.5, 670 + textYOffset);
      } else {
        ctx.fillText(`NIS / NISN : ${data.nisn || '-'}`, 336.5, 635 + textYOffset);
        
        let ttlStr = 'TTL : -';
        if (data.tempatLahir && data.tglLahir) {
          ttlStr = `TTL : ${data.tempatLahir}, ${data.tglLahir}`;
        } else if (data.tempatLahir) {
          ttlStr = `TTL : ${data.tempatLahir}`;
        } else if (data.tglLahir) {
          ttlStr = `TTL : ${data.tglLahir}`;
        }
        ctx.fillText(ttlStr, 336.5, 670 + textYOffset);

        const cleanVa = data.noVa ? data.noVa.replace(/,/g, '.') : '-';
        ctx.fillText(`NO. V.A. : ${cleanVa}`, 336.5, 705 + textYOffset);
      }

      // 3. Barcode
      const barcodeCanvas = document.getElementById('hiddenBarcodeCanvas');
      try {
        const barcodeVal = data.nisn || '000000';
        JsBarcode(barcodeCanvas, barcodeVal.toString(), {
          format: "CODE128",
          width: 3,
          height: 90,
          displayValue: false
        });

        const bWidth = 460;
        const bHeight = 100;
        const bX = (673 - bWidth) / 2;
        const bY = 885;
        ctx.drawImage(barcodeCanvas, bX, bY, bWidth, bHeight);
      } catch (err) {
        console.warn("Error rendering barcode:", err);
      }

      // 4. Footer Website
      const footerVal = document.getElementById('footerInput') ? document.getElementById('footerInput').value : '';
      if (footerVal) {
        ctx.save();
        if ('letterSpacing' in ctx) {
          ctx.letterSpacing = "3px";
        }
        ctx.font = `bold 16px ${fontDinBold}`;
        ctx.fillStyle = "#333333";
        ctx.fillText(footerVal, 336.5, 1025);
        ctx.restore();
      }
    }

    function downloadSingleCard() {
      const canvas = document.getElementById('previewCanvas');
      const activeData = databaseData[selectedIndex];
      const filename = activeData ? `ID_CARD_${activeData.nisn}_${activeData.nama}.png` : 'ID_CARD.png';
      
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function downloadZipBatch() {
      const completedItems = databaseData.filter(d => d.photo !== null);
      if (completedItems.length === 0) {
        alert("Belum ada foto yang dijepret/diunggah!");
        return;
      }

      const zip = new JSZip();
      const folder = zip.folder("ID_Cards_Hasil");

      const offscreenCanvas = document.createElement('canvas');
      offscreenCanvas.width = 673;
      offscreenCanvas.height = 1063;
      const offCtx = offscreenCanvas.getContext('2d');

      const preset = document.getElementById('presetSelect').value;
      const scale = parseFloat(document.getElementById('photoScale').value) / 100;
      const photoY = parseFloat(document.getElementById('photoY').value);
      const textY = parseFloat(document.getElementById('textY').value);

      for (let item of completedItems) {
        offCtx.clearRect(0, 0, 673, 1063);
        if (templateImage.complete && templateImage.naturalWidth > 0) {
          offCtx.drawImage(templateImage, 0, 0, 673, 1063);
        } else {
          offCtx.fillStyle = "#ffffff";
          offCtx.fillRect(0, 0, 673, 1063);
        }

        await new Promise((resolve) => {
          const img = new Image();
          img.onload = function() {
            offCtx.save();
            const centerX = 336.5;
            const centerY = 425 + photoY;
            const radius = (250 * scale) / 2;

            offCtx.beginPath();
            offCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            offCtx.clip();
            offCtx.drawImage(img, centerX - radius, centerY - radius, radius * 2, radius * 2);
            offCtx.restore();

            drawCardTextAndBarcode(offCtx, item, preset, textY);

            const dataUrl = offscreenCanvas.toDataURL('image/png');
            const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
            folder.file(`ID_CARD_${item.nisn}_${item.nama}.png`, base64Data, { base64: true });
            resolve();
          };
          img.src = item.photo;
        });
      }

      zip.generateAsync({ type: "blob" }).then(function(content) {
        saveAs(content, "ID_Cards_Hasil_Selesai.zip");
      });
    }
  </script>
