<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Generator ID Card & Kartu Pelajar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Third-party Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .step-header { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #495057; margin-bottom: 8px; }
    .badge-step { background-color: #212529; color: #fff; border-radius: 50%; padding: 3px 7px; margin-right: 5px; font-size: 0.75rem; }
    #previewCanvas { width: 100%; max-width: 380px; height: auto; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); background: #fff; }
    .video-container { position: relative; width: 100%; height: 260px; background-color: #000; border-radius: 8px; overflow: hidden; }
    #videoElement { width: 100%; height: 100%; object-fit: cover; }
    .crop-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px dashed #00ff66; pointer-events: none; }
    .crop-overlay.circle { width: 160px; height: 160px; border-radius: 50%; }
    .crop-overlay.square { width: 160px; height: 160px; border-radius: 8px; }
    .data-list { max-height: 200px; overflow-y: auto; font-size: 0.9rem; }
    .data-item { cursor: pointer; transition: background 0.2s; }
    .data-item:hover, .data-item.active { background-color: #e7f1ff; font-weight: 600; }
  </style>
</head>
<body class="py-4">
  <div class="container-fluid px-4">
    <div class="row g-4">
      
      <!-- KIRI: CONTROL PANEL -->
      <div class="col-lg-7">
        <div class="card p-3 mb-3">
          <div class="step-header"><span class="badge-step">⚙</span> PRESET LAYOUT & PENYESUAIAN VISUAL FOTO</div>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Jenis Preset Layout:</label>
              <select id="presetSelect" class="form-select form-select-sm" onchange="renderCard()">
                <option value="karyawan">ID Card Karyawan (circle)</option>
                <option value="pelajar" selected>ID Card Pelajar (square)</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Skala Foto (<span id="scaleVal">100</span>%):</label>
              <input type="range" class="form-range" id="photoScale" min="50" max="200" value="100" oninput="document.getElementById('scaleVal').innerText=this.value; renderCard();">
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">Geser Y (<span id="yVal">0</span>px):</label>
              <input type="range" class="form-range" id="photoY" min="-150" max="150" value="0" oninput="document.getElementById('yVal').innerText=this.value; renderCard();">
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-md-6">
            <div class="card p-3 h-100">
              <div class="step-header"><span class="badge-step">1</span> DATABASE (EXCEL/CSV)</div>
              <input type="file" id="excelInput" class="form-control form-control-sm" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)">
            </div>
          </div>
          <div class="col-md-6">
            <div class="card p-3 h-100">
              <div class="step-header"><span class="badge-step">2</span> TEMPLATE ID CARD (BACKGROUND)</div>
              <input type="file" id="templateInput" class="form-control form-control-sm" accept="image/*" onchange="handleTemplateUpload(event)">
            </div>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <div class="step-header"><span class="badge-step">3</span> INPUT KAMERA</div>
          <div class="row g-2 align-items-center">
            <div class="col-8">
              <select id="cameraSelect" class="form-select form-select-sm"></select>
            </div>
            <div class="col-4">
              <button class="btn btn-primary btn-sm w-100" onclick="startCamera()">📷 Pindai / Start</button>
            </div>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <div class="step-header"><span class="badge-step">4</span> PILIH DATA TERHUBUNG</div>
          <input type="text" id="searchInput" class="form-control form-control-sm mb-2" placeholder="Cari Nama / NISN / NIK..." oninput="filterDataList()">
          <div class="list-group data-list" id="dataListContainer">
            <div class="list-group-item text-muted small">Silakan unggah file Excel data pelajar/karyawan...</div>
          </div>
        </div>

        <div class="card p-3 mt-3">
          <div class="step-header"><span class="badge-step">5</span> AMBIL / UNGGAH FOTO</div>
          <div class="video-container mb-2">
            <video id="videoElement" autoplay playsinline></video>
            <div id="cropOverlay" class="crop-overlay square"></div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm flex-fill" onclick="capturePhoto()">📸 Jepret Kamera</button>
            <label class="btn btn-info btn-sm flex-fill text-white m-0">
              📂 Unggah Single <input type="file" hidden accept="image/*" onchange="handleSinglePhotoUpload(event)">
            </label>
          </div>
        </div>
      </div>

      <!-- KANAN: PREVIEW CANVA & ACTIONS -->
      <div class="col-lg-5 text-center">
        <div class="card p-4 d-flex flex-column align-items-center">
          <h6 class="fw-bold mb-1">PREVIEW ID CARD HASIL</h6>
          <p class="text-muted small mb-3" id="targetInfo">Target: -</p>
          
          <!-- Canvas Render Core (673 x 1063 px) -->
          <canvas id="previewCanvas" width="673" height="1063"></canvas>

          <div class="mt-4 w-100">
            <button class="btn btn-primary w-100 py-2 fw-bold mb-2" onclick="downloadSingleCard()">💾 UNDUH ID CARD (.PNG)</button>
            <button class="btn btn-outline-danger btn-sm w-100" onclick="deleteCurrentPhoto()">🗑 Hapus Foto Terpasang</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Offscreen Canvas for Barcode Generation -->
  <canvas id="hiddenBarcodeCanvas" style="display:none;"></canvas>

  <script>
    // System State Variables
    let databaseData = [];
    let selectedIndex = -1;
    let templateImage = new Image();
    let currentStream = null;

    // Load Default Canvas Layout & Event Listeners
    window.onload = function() {
      // Default Background Canvas setup
      templateImage.onload = function() { renderCard(); };
      // Fallback blank white template if user hasn't uploaded one
      createBlankTemplate();
    };

    function createBlankTemplate() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 673;
      tempCanvas.height = 1063;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.fillStyle = "#ffffff";
      tCtx.fillRect(0, 0, 673, 1063);
      templateImage.src = tempCanvas.toDataURL();
    }

    // 1. Handle Excel Upload
    function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.SheetNames[0];
        const rawData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
        
        databaseData = rawData.map(item => ({
          nisn: item['NIS/NISN'] || item['NPP/NIK'] || item['NIS'] || item['NIK'] || '20241001',
          nama: item['Nama Lengkap'] || item['Nama'] || 'Nama Peserta',
          tempatLahir: item['Tempat Lahir'] || '',
          tanggalLahir: item['Tanggal Lahir'] || '',
          noVa: item['No. V.A.'] || item['No VA'] || item['Jabatan'] || '',
          photo: null
        }));

        renderDataList(databaseData);
        if (databaseData.length > 0) selectDataItem(0);
      };
      reader.readAsArrayBuffer(file);
    }

    // 2. Render Data List
    function renderDataList(list) {
      const container = document.getElementById('dataListContainer');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<div class="list-group-item text-muted small">Tidak ada data ditemukan.</div>';
        return;
      }

      list.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = `list-group-item list-group-item-action data-item d-flex justify-content-between align-items-center ${index === selectedIndex ? 'active' : ''}`;
        el.onclick = () => selectDataItem(index);
        
        const hasPhotoBadge = item.photo ? '<span class="badge bg-success">✓ Foto</span>' : '<span class="badge bg-secondary">Belum</span>';
        el.innerHTML = `<div><strong>${item.nisn}</strong> — ${item.nama}</div> ${hasPhotoBadge}`;
        container.appendChild(el);
      });
    }

    function filterDataList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = databaseData.filter(d => 
        d.nama.toLowerCase().includes(query) || d.nisn.toString().includes(query)
      );
      renderDataList(filtered);
    }

    function selectDataItem(idx) {
      selectedIndex = idx;
      renderDataList(databaseData);
      const current = databaseData[selectedIndex];
      if (current) {
        document.getElementById('targetInfo').innerText = `Target: ${current.nama} (${current.nisn})`;
      }
      renderCard();
    }

    // 3. Handle Template Upload
    function handleTemplateUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        templateImage = new Image();
        templateImage.onload = () => renderCard();
        templateImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 4. Camera Stream Logic
    async function startCamera() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        const select = document.getElementById('cameraSelect');
        select.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Kamera ${index + 1}`;
          select.appendChild(option);
        });

        const constraints = {
          video: { deviceId: select.value ? { exact: select.value } : undefined }
        };

        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('videoElement').srcObject = currentStream;
      } catch (err) {
        alert("Gagal mengakses kamera: " + err.message);
      }
    }

    function capturePhoto() {
      if (selectedIndex < 0) {
        alert("Pilih data siswa/karyawan terlebih dahulu!");
        return;
      }
      const video = document.getElementById('videoElement');
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      
      // Crop center square
      const minDim = Math.min(video.videoWidth, video.videoHeight);
      const sx = (video.videoWidth - minDim) / 2;
      const sy = (video.videoHeight - minDim) / 2;
      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 400, 400);

      databaseData[selectedIndex].photo = canvas.toDataURL('image/png');
      renderDataList(databaseData);
      renderCard();
    }

    function handleSinglePhotoUpload(e) {
      if (selectedIndex < 0) {
        alert("Pilih data siswa/karyawan terlebih dahulu!");
        return;
      }
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        databaseData[selectedIndex].photo = evt.target.result;
        renderDataList(databaseData);
        renderCard();
      };
      reader.readAsDataURL(file);
    }

    function deleteCurrentPhoto() {
      if (selectedIndex >= 0 && databaseData[selectedIndex]) {
        databaseData[selectedIndex].photo = null;
        renderDataList(databaseData);
        renderCard();
      }
    }

    // 5. ID CARD RENDER ENGINE (673 x 1063 px Precision)
    function renderCard() {
      const mainCanvas = document.getElementById('previewCanvas');
      const ctx = mainCanvas.getContext('2d');
      const preset = document.getElementById('presetSelect').value;
      const cropOverlay = document.getElementById('cropOverlay');

      // Update overlay visual camera
      cropOverlay.className = `crop-overlay ${preset === 'karyawan' ? 'circle' : 'square'}`;

      // Reset & Draw Background Template
      ctx.clearRect(0, 0, 673, 1063);
      if (templateImage.complete && templateImage.naturalWidth > 0) {
        ctx.drawImage(templateImage, 0, 0, 673, 1063);
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 673, 1063);
      }

      const activeData = databaseData[selectedIndex] || {
        nama: 'MICHAEL TANUWIDJAJA',
        nisn: '20241003',
        tempatLahir: 'Bandung',
        tanggalLahir: '05 Desember 2009',
        noVa: '880.120.241.003',
        photo: null
      };

      // Photo Rendering Scaling & Translation
      const scale = parseFloat(document.getElementById('photoScale').value) / 100;
      const offsetY = parseFloat(document.getElementById('photoY').value);

      if (activeData.photo) {
        const img = new Image();
        img.onload = function() {
          ctx.save();
          if (preset === 'karyawan') {
            // Circle Photo Center Setup
            const centerX = 336.5;
            const centerY = 430 + offsetY;
            const radius = (250 * scale) / 2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(img, centerX - radius, centerY - radius, radius * 2, radius * 2);
          } else {
            // Square Photo Center Setup (ID Card Pelajar)
            const w = 250 * scale;
            const h = 250 * scale;
            const x = (673 - w) / 2;
            const y = 310 + offsetY;

            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 12);
            ctx.clip();
            ctx.drawImage(img, x, y, w, h);
          }
          ctx.restore();
          drawCardTextAndBarcode(ctx, activeData, preset);
        };
        img.src = activeData.photo;
      } else {
        // Draw Placeholder Photo
        ctx.save();
        ctx.fillStyle = "#e9ecef";
        if (preset === 'karyawan') {
          ctx.beginPath();
          ctx.arc(336.5, 430 + offsetY, 125 * scale, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect((673 - 250 * scale) / 2, 310 + offsetY, 250 * scale, 250 * scale);
        }
        ctx.restore();
        drawCardTextAndBarcode(ctx, activeData, preset);
      }
    }

    function drawCardTextAndBarcode(ctx, data, preset) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#0d233a";

      // 1. Render Nama Lengkap
      ctx.font = "bold 32px 'Segoe UI', Arial";
      ctx.fillText(data.nama.toUpperCase(), 336.5, 595);

      // 2. Render Text Details
      ctx.font = "20px 'Segoe UI', Arial";
      ctx.fillStyle = "#333333";

      if (preset === 'pelajar') {
        // Data Kartu Pelajar Format
        ctx.fillText(`NIS/NISN : ${data.nisn}`, 336.5, 645);
        
        const ttlText = (data.tempatLahir || data.tanggalLahir) 
          ? `TTL : ${data.tempatLahir}${data.tempatLahir && data.tanggalLahir ? ', ' : ''}${data.tanggalLahir}`
          : 'TTL : Bandung, 05 Desember 2009';
        ctx.fillText(ttlText, 336.5, 685);

        ctx.fillText(`No. V.A. : ${data.noVa || '-'}`, 336.5, 725);
      } else {
        // Data ID Card Karyawan Format
        ctx.fillText(`NIK/NPP : ${data.nisn}`, 336.5, 645);
        ctx.fillText(`JABATAN : ${data.noVa || 'STAF'}`, 336.5, 685);
      }

      // 3. Render Enlarged Barcode (Bottom Center Position)
      const barcodeCanvas = document.getElementById('hiddenBarcodeCanvas');
      try {
        JsBarcode(barcodeCanvas, data.nisn.toString(), {
          format: "CODE128",
          width: 3,
          height: 90,
          displayValue: false
        });

        // Draw enlarged barcode onto main canvas
        const bWidth = 450;
        const bHeight = 110;
        const bX = (673 - bWidth) / 2;
        const bY = 850;
        ctx.drawImage(barcodeCanvas, bX, bY, bWidth, bHeight);
      } catch (err) {
        console.warn("Gagal merender barcode:", err);
      }
    }

    // 6. Download Single Image
    function downloadSingleCard() {
      const canvas = document.getElementById('previewCanvas');
      const activeData = databaseData[selectedIndex];
      const filename = activeData ? `ID_CARD_${activeData.nisn}_${activeData.nama}.png` : 'ID_CARD.png';
      
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
